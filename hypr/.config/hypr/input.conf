input {
	kb_layout = us

	repeat_rate = 25
	repeat_delay = 500

	follow_mouse = 1
	sensitivity = 0
	accel_profile = flat

	touchpad {
		natural_scroll = false
		tap-to-click = true
	}
}

gestures {
	workspace_swipe = true
	workspace_swipe_fingers = 3
	workspace_swipe_fingers = 300
	workspace_swipe_invert = false
}
