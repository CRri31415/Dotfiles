general {
	gaps_in = 0
	gaps_out = 0

	border_size = 2

	col.active_border = $outline
	col.inactive_border = $outline_variant

	layout = dwindle

	resize_on_border = true

	allow_tearing = true
}

decoration {
	rounding = 8
	rounding_power = 3.0

	active_opacity = 1.0
	inactive_opacity = 0.7
	fullscreen_opacity = 1.0

	shadow {
		enabled = true
		range = 16
		render_power = 3

		color = $shadow
	}

	blur {
		enabled = true
		size = 6
		passes = 3

		new_optimizations = true

		xray = false
		ignore_opacity = true
	}
}

