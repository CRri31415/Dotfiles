general {
	screencopy_mode = 1
}

background {
	#path = /tmp/current-wallpaper
	path = screenshot
	color = rgb(0,0,0)
	blur_size = 4
	blur_passes = 2
}

input-field {
	size = 400, 100
	outline_thickness = 2
	dots_size = 0.4
	dots_center = true
	position = 0, -300
	halign = center
	valign = center
	hide_input = false
	inner_color = rgb(FFFFFF)
	font_color = rgb(10,10,10)
	fade_on_empty = false
}

label {
	text = cmd[update:1000] echo "<b><big> "$(date +'%H')" </big></b>"
	font_size = 200
	font_family = JuliaMono Nerd Font
	position = 0, 300
	halign = center
	valign = center
	shadow_size = 16
	shadow_passes = 4
	color = rgb(FFFFFF)
}


label {
	text = cmd[update:1000] echo "<b><big> "$(date +'%M')" </big></b>"
	font_size = 200
	font_family = JuliaMono Nerd Font
	position = 0, 100
	halign = center
	valign = center
	shadow_size = 16
	shadow_passes = 4
	color = rgb(FFFFFF)
}
